# Тулинг репозитория для хоста и CI (jdx/mise-action). Версию питона держит
# .python-version, зависимости проекта ставит uv. Версии проверок не пиним: latest.
[tools]
node = "26"
uv = "latest"
hk = "2"
pkl = "latest"
ty = "latest"
hadolint = "latest"
shellcheck = "latest"
"github:quarylabs/sqruff" = "latest"
typos = "latest"
rumdl = "latest"
lychee = "latest"
jactionlint = "latest"
betterleaks = "latest"
osv-scanner = "latest"
"npm:@commitlint/cli" = "latest"
"npm:@commitlint/config-conventional" = "latest"

[tasks.setup]
description = "Поставить зависимости и git-хуки"
run = ["uv sync", "hk install"]

[tasks.check]
description = "Все проверки, тот же набор, что гоняет CI"
run = "hk check --all"

[tasks.fix]
description = "Применить автоисправления"
run = "hk fix --all"
