[project]
name = "python-flask-example"
version = "0.1.0"
description = "A simple Flask app"
readme = "README.md"
license = { text = "ISC" }
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1.1",
    "gunicorn>=23.0.0",
    "psycopg[binary]>=3.3.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.20",
]

[tool.ruff]
line-length = 80
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    ".eggs",
    "*.egg",
    ".vscode",
]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"
